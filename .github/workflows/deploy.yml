name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # CALIDAD
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Equivalente a: uv sync
        run: uv sync --all-extras --dev

      - name: Run Linter (Ruff)
        # Equivalente a: uv run ruff check .
        run: uv run ruff check .

      - name: Check Formatting
        # Equivalente a: uv run ruff format --check .
        run: uv run ruff format --check .

      - name: Run Static Type Checker (Pyright)
        # Equivalente a: uv run pyright
        run: uv run pyright

      - name: Run Tests
        # Equivalente a: uv run pytest
        run: uv run pytest

  #  DESPLIEGUE
  deploy:
    name: Build & Deploy
    needs: quality # Si falla la calidad, no desplegamos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        # Equivalente a: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        # Equivalente a: docker build Y docker push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sergy125/cicd-kata:latest

      - name: Trigger Render Deployment
        # Equivalente a: curl ...
        run: |
          curl "${{ secrets.DEPLOY_WEBHOOK_URL }}&imgURL=docker.io%2Fsergy125%2Fcicd-kata%3Alatest"