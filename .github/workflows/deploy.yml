name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- TRABAJO 1: INTEGRACIÓN CONTINUA (CI) ---
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Linter (Ruff)
        run: uv run ruff check .

      - name: Check Formatting
        run: uv run ruff format --check .

      - name: Run Tests
        run: uv run pytest

  # --- TRABAJO 2: DESPLIEGUE CONTINUO (CD) ---
  deploy:
    name: Build & Deploy
    needs: quality # ¡Importante! Solo despliega si el código está bien
    if: github.ref == 'refs/heads/main' # Solo despliega si es la rama principal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Aquí usamos tu usuario y nombre de imagen
          tags: sergy125/cicd-kata:latest

      - name: Trigger Render Deployment
        # Esta es la llamada mágica que avisa a Render
        run: |
          curl "${{ secrets.DEPLOY_WEBHOOK_URL }}&imgURL=docker.io%2Fsergy125%2Fcicd-kata%3Alatest"